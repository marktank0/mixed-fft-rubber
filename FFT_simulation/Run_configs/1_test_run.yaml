version: 1
# Relative paths below are resolved against the repository root (the parent of
# FFT_simulation/), not the working directory.
base_path: .

experiment:
  name: different_filling_settings
  output_root: Results/different_filling_settings

run:
  mode: cases # cases | batch

execution:
  max_workers: 4
  log_to_file: true
  on_existing: overwrite # skip | overwrite | error
  save_resolved_config: true
  thread_env:
    OMP_NUM_THREADS: 1
    OPENBLAS_NUM_THREADS: 1
    MKL_NUM_THREADS: 1
    NUMEXPR_NUM_THREADS: 1
    FFT_WORKERS: 1

defaults:
  solver:
    type: mixed
    N: 63
    increments:
      repeat: 10
      value: 0.1
    preconditioner: green
    diagnostics: false
    max_newton: 100
    min_substep_ratio: 0.125
    #tol_rel: 
    # gmres_restart: 40 # Num of vectors

  phases:
    matrix_phase: 0
    filler_phase: 1
    phase_key: phase

  outputs:
    save_plots: true
    plot_dpi: 200
    save_fields: false
    field_filename: fields.vti

  charge:
    path: FFT_simulation/Run_configs/Charges/Neo_1.0_E10-100.txt

batch:
  structures:
    glob: microstructure_generation/3D_samples/test/voxel_structures/*.npz
    sort: name
    include: ["*_voxel.npz"]
    exclude: ["test_*"]

cases:
  - name: unfilled
    structure_path: microstructure_generation\3D_samples\different_fillings\unfilled_voxel.npz

  - name: 1r_filled
    structure_path: microstructure_generation\3D_samples\different_fillings\1r_filled_voxel.npz

  - name: 2r_filled
    structure_path: microstructure_generation\3D_samples\different_fillings\2r_filled_voxel.npz