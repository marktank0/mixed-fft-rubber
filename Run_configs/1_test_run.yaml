version: 1
base_path: .

experiment:
  name: 30_struct_test_run
  output_root: Results/speed_test_18_07_higher_contrast

run:
  mode: cases # cases | batch

execution:
  max_workers: 1
  log_to_file: true
  on_existing: skip # skip | overwrite | error
  save_resolved_config: true
  thread_env:
    OMP_NUM_THREADS: 1
    OPENBLAS_NUM_THREADS: 1
    MKL_NUM_THREADS: 1
    NUMEXPR_NUM_THREADS: 1

defaults:
  solver:
    type: mixed
    N: 31
    increments:
      repeat: 10
      value: 0.1
    preconditioner: reference
    diagnostics: false
    savemodel: normal

  phases:
    matrix_phase: 0
    filler_phase: 1
    phase_key: phase

  outputs:
    save_plots: true
    plot_dpi: 200
    save_fields: false
    field_filename: fields.vti

  charge:
    path: 3D_samples/Charges/Neo_0.5_E10-5000x.txt

batch:
  structures:
    glob: microstructure_generation/3D_samples/test/voxel_structures/*.npz
    sort: name
    include: ["*_voxel.npz"]
    exclude: ["test_*"]

cases:
  - name: one_voxel_higher_contrast_branch
    structure_path: 3D_samples/voxels/1_voxel.npz