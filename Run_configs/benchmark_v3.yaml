version: 1
base_path: .

experiment:
  name: benchmark_v3
  output_root: Results/Benchmark_v3

run:
  mode: cases # cases | batch

execution:
  max_workers: 2
  log_to_file: true
  on_existing: error # skip | overwrite | error
  save_resolved_config: true
  thread_env:
    OMP_NUM_THREADS: 1
    OPENBLAS_NUM_THREADS: 1
    MKL_NUM_THREADS: 1
    NUMEXPR_NUM_THREADS: 1

defaults:
  solver:
    type: mixed
    N: 31
    increments:
      repeat: 2
      value: 0.5
    preconditioner: reference
    diagnostics: false
    savemodel: normal

  phases:
    matrix_phase: 0
    filler_phase: 1
    phase_key: phase

  outputs:
    save_plots: true
    plot_dpi: 200
    save_fields: false
    field_filename: fields.vti

  charge:
    path: 3D_samples/Charges/Neo_1.0_E10-100x.txt

batch:
  structures:
    glob: 3D_samples/voxels/*.npz
    sort: name
    include: ["*_voxel.npz"]
    exclude: ["test_*"]

cases:
  - name: one_voxel
    structure_path: 3D_samples/voxels/1_voxel.npz

  - name: two_voxel
    structure_path: 3D_samples/voxels/2_voxel.npz