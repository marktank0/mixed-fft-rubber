version: 1
base_path: /home/jovyan/mixed-fft-rubber/

experiment:
  name: 50_struct_test_run
  output_root: Results/50_improved_struct_v1

run:
  mode: batch # cases | batch

execution:
  max_workers: 60
  log_to_file: true
  on_existing: skip # skip | overwrite | error
  save_resolved_config: true
  thread_env:
    OMP_NUM_THREADS: 1
    OPENBLAS_NUM_THREADS: 1
    MKL_NUM_THREADS: 1
    NUMEXPR_NUM_THREADS: 1
    FFT_WORKERS: 1

defaults:
  solver:
    type: mixed
    N: 63
    increments:
      repeat: 10
      value: 0.10
    preconditioner: reference
    diagnostics: false
    savemodel: normal
    max_newton: 100
    min_substep_ratio: 0.125
    #tol_rel: 
    gmres_restart: 800 #MB

  phases:
    matrix_phase: 0
    filler_phase: 1
    phase_key: phase

  outputs:
    save_plots: true
    plot_dpi: 200
    save_fields: false
    field_filename: fields.vti

  charge:
    path: 3D_samples/Charges/Neo_1.0_E10-100x.txt

batch:
  structures:
    glob: microstructure_generation/3D_samples/test/voxel_structures/*.npz
    sort: name
    include: ["*_voxel.npz"]
    exclude: ["test_*"]

cases:
  - name: one_voxel
    structure_path: 3D_samples/voxels/1_voxel.npz

  - name: two_voxel
    structure_path: 3D_samples/voxels/2_voxel.npz